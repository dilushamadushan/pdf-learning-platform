version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidoc-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - URL=${MONGODB_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/upload
    networks:
      - aidoc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aidoc-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - aidoc-network

volumes:
  uploads_data:

networks:
  aidoc-network:
    driver: bridge
